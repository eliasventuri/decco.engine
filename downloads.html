<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decco — Descargas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #067d76;
            --primary-glow: rgba(6, 125, 118, 0.3);
            --bg: #0a0a0a;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(6, 125, 118, 0.4);
            --text: #f0f0f0;
            --text-muted: #888;
            --text-dim: #555;
            --danger: #ef4444;
            --danger-surface: rgba(239, 68, 68, 0.1);
            --success: #22c55e;
            --success-surface: rgba(34, 197, 94, 0.1);
            --warning: #f59e0b;
        }

        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-app-region: drag;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(6, 125, 118, 0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(6, 125, 118, 0.04) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 680px;
            margin: 0 auto;
            padding: 32px 24px;
            -webkit-app-region: no-drag;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .header-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), #0a5c57);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px var(--primary-glow);
        }

        .header-icon svg { width: 20px; height: 20px; fill: white; }

        .header h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header .badge {
            margin-left: auto;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 64px 24px;
            color: var(--text-dim);
        }

        .empty-state svg {
            width: 56px;
            height: 56px;
            stroke: var(--text-dim);
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .empty-state p {
            font-size: 13px;
            line-height: 1.5;
        }

        /* Download Card */
        .download-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .download-card:hover {
            border-color: var(--border-hover);
            box-shadow: 0 0 24px rgba(6, 125, 118, 0.08);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.4;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-status {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 3px 8px;
            border-radius: 6px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .card-status.downloading {
            color: var(--primary);
            background: rgba(6, 125, 118, 0.15);
        }

        .card-status.completed {
            color: var(--success);
            background: var(--success-surface);
        }

        .card-status.paused {
            color: var(--warning);
            background: rgba(245, 158, 11, 0.15);
        }

        .card-status.loading {
            color: var(--text-muted);
            background: var(--surface);
        }

        .card-status.error {
            color: var(--danger);
            background: var(--danger-surface);
        }

        /* Progress Bar */
        .progress-container {
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #0ab3a8);
            border-radius: 3px;
            transition: width 0.5s ease;
            position: relative;
        }

        .progress-fill.completed {
            background: linear-gradient(90deg, var(--success), #4ade80);
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 30px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
            border-radius: 3px;
            animation: shimmer 1.5s infinite;
        }

        .progress-fill.completed::after { display: none; }

        @keyframes shimmer {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Stats row */
        .stats-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 12px;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stat svg { width: 13px; height: 13px; stroke: currentColor; fill: none; }

        .stat .value {
            color: var(--text);
            font-weight: 700;
        }

        /* Action buttons */
        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface);
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-app-region: no-drag;
        }

        .btn:hover {
            background: var(--surface-hover);
            color: var(--text);
            border-color: rgba(255,255,255,0.15);
        }

        .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }

        .btn-primary {
            background: rgba(6, 125, 118, 0.15);
            border-color: rgba(6, 125, 118, 0.3);
            color: var(--primary);
        }

        .btn-primary:hover {
            background: rgba(6, 125, 118, 0.25);
            color: #0ab3a8;
            border-color: var(--primary);
        }

        .btn-danger {
            color: var(--danger);
        }

        .btn-danger:hover {
            background: var(--danger-surface);
            border-color: rgba(239, 68, 68, 0.3);
        }

        /* Subtitle tag */
        .subtitle-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }

        .sub-tag {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(6, 125, 118, 0.1);
            color: var(--primary);
            border: 1px solid rgba(6, 125, 118, 0.2);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Loading animation */
        .loading-dot {
            display: inline-block;
            animation: pulse 1.4s infinite ease-in-out both;
        }
        .loading-dot:nth-child(1) { animation-delay: -0.32s; }
        .loading-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

        /* File size helper */
        .file-info {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </div>
            <h1>Descargas</h1>
            <span class="badge" id="countBadge">0</span>
        </div>

        <div id="downloadsList"></div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8888';

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatSpeed(bytesPerSecond) {
            if (!bytesPerSecond || bytesPerSecond < 1) return '0 KB/s';
            return formatBytes(bytesPerSecond) + '/s';
        }

        async function fetchDownloads() {
            try {
                const res = await fetch(`${API_BASE}/download/list`);
                const data = await res.json();
                renderDownloads(data.downloads || []);
            } catch (e) {
                console.error('Failed to fetch downloads:', e);
            }
        }

        async function pauseDownload(hash) {
            await fetch(`${API_BASE}/download/pause/${hash}`);
            fetchDownloads();
        }

        async function resumeDownload(hash) {
            await fetch(`${API_BASE}/download/resume/${hash}`);
            fetchDownloads();
        }

        async function deleteDownload(hash) {
            if (!confirm('¿Eliminar esta descarga y sus archivos?')) return;
            await fetch(`${API_BASE}/download/delete/${hash}`);
            fetchDownloads();
        }

        async function openDownload(hash) {
            await fetch(`${API_BASE}/download/open/${hash}`);
        }

        function renderDownloads(downloads) {
            const container = document.getElementById('downloadsList');
            const badge = document.getElementById('countBadge');
            badge.textContent = downloads.length;

            if (downloads.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <h3>Sin descargas</h3>
                        <p>Las descargas que inicies desde Decco<br>aparecerán aquí automáticamente.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = downloads.map(dl => {
                const progress = Math.round((dl.progress || 0) * 100);
                const isCompleted = dl.status === 'completed';
                const isPaused = dl.status === 'paused';
                const isDownloading = dl.status === 'downloading';
                const isLoading = dl.status === 'loading';

                const subtitleTags = (dl.subtitles || []).map(s =>
                    `<span class="sub-tag">${s.lang || s.label}</span>`
                ).join('');

                let actions = '';
                if (isDownloading || isLoading) {
                    actions = `
                        <button class="btn" onclick="pauseDownload('${dl.hash}')">
                            <svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                            Pausar
                        </button>
                        <button class="btn btn-danger" onclick="deleteDownload('${dl.hash}')">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            Eliminar
                        </button>
                    `;
                } else if (isPaused) {
                    actions = `
                        <button class="btn btn-primary" onclick="resumeDownload('${dl.hash}')">
                            <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                            Reanudar
                        </button>
                        <button class="btn btn-danger" onclick="deleteDownload('${dl.hash}')">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            Eliminar
                        </button>
                    `;
                } else if (isCompleted) {
                    actions = `
                        <button class="btn btn-primary" onclick="openDownload('${dl.hash}')">
                            <svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                            Abrir Ubicación
                        </button>
                        <button class="btn btn-danger" onclick="deleteDownload('${dl.hash}')">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            Eliminar
                        </button>
                    `;
                } else {
                    actions = `
                        <button class="btn btn-danger" onclick="deleteDownload('${dl.hash}')">
                            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            Eliminar
                        </button>
                    `;
                }

                return `
                    <div class="download-card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">${dl.title || 'Video'}${dl.season && dl.episode ? ` — S${String(dl.season).padStart(2,'0')}E${String(dl.episode).padStart(2,'0')}` : ''}</div>
                                ${dl.fileName ? `<div class="file-info">${dl.fileName} • ${formatBytes(dl.fileSize)}</div>` : ''}
                            </div>
                            <span class="card-status ${dl.status}">${
                                isCompleted ? 'Completado' :
                                isPaused ? 'Pausado' :
                                isDownloading ? 'Descargando' :
                                isLoading ? 'Conectando…' :
                                dl.status === 'error' ? 'Error' : dl.status
                            }</span>
                        </div>

                        <div class="progress-container">
                            <div class="progress-bar">
                                <div class="progress-fill ${isCompleted ? 'completed' : ''}" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <div class="stats-row">
                            <div class="stat">
                                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                                <span class="value">${progress}%</span>
                            </div>
                            ${isDownloading ? `
                                <div class="stat">
                                    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                                    <span class="value">${formatSpeed(dl.speed)}</span>
                                </div>
                                <div class="stat">
                                    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                                    <span class="value">${dl.peers || 0}</span> peers
                                </div>
                            ` : ''}
                        </div>

                        ${subtitleTags ? `<div class="subtitle-tags">${subtitleTags}</div>` : ''}

                        <div class="actions">${actions}</div>
                    </div>
                `;
            }).join('');
        }

        // Initial fetch and polling with resilient recursive timeout
        let active = true;
        async function poll() {
            await fetchDownloads();
            if (active) {
                setTimeout(poll, 1500);
            }
        }
        poll();

        window.addEventListener('beforeunload', () => {
            active = false;
        });
    </script>
</body>
</html>
